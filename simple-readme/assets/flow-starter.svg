<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">入力から成果物までの流れ</title>
  <desc id="desc">入力ファイルを変換ツールが処理し、出力ファイルを生成する。矢印はデータの流れを示す。</desc>
  <!-- Generic starter: replace nodes, roles and relationships with verified project facts. -->
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; fill: #172033; }
    .name { font-size: 22px; font-weight: 650; }
    .body { font-size: 17px; fill: #475569; }
    .caption { font-size: 15px; fill: #64748b; }
    .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.2; }
    .wire { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#flow-arrow); }
  </style>
  <rect width="960" height="380" rx="16" fill="#fff"/>
  <text x="40" y="60" class="name">入出力の流れ</text>
  <text x="40" y="90" class="body">何を受け取り、何を処理し、何を得るか</text>

  <path d="M280 210 H360" class="wire"/>
  <path d="M600 210 H680" class="wire"/>

  <rect x="40" y="146" width="240" height="128" rx="12" class="card"/>
  <text x="64" y="187" class="name">入力ファイル</text>
  <text x="64" y="224" class="body">必要なデータ・形式</text>
  <text x="64" y="250" class="caption">入手先や最小サンプル</text>

  <rect x="360" y="146" width="240" height="128" rx="12" fill="#fff" stroke="#334155" stroke-width="1.6"/>
  <text x="384" y="187" class="name">変換ツール</text>
  <text x="384" y="224" class="body">主な処理</text>
  <text x="384" y="250" class="caption">実際のコマンドや公開API</text>

  <rect x="680" y="146" width="240" height="128" rx="12" class="card"/>
  <text x="704" y="187" class="name">出力ファイル</text>
  <text x="704" y="224" class="body">成果物・確認できる結果</text>
  <text x="704" y="250" class="caption">保存先や次の使い道</text>

  <text x="40" y="331" class="caption">矢印はデータの流れを示します。</text>
</svg>
